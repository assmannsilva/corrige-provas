name: Fix frontend style

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prettier-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fix ESLint rules
        run: npm run lint
      - name: Apply Prettier
        run: npm run format
      - name: Verify lint
        run: npm run lint:check
      - name: Verify formatting
        run: npm run format:check
      - name: Commit formatted sources
        run: |
          git config user.name "Caue Assmann Silva"
          git config user.email "caueassmannsilva114@gmail.com"
          git add resources/
          if ! git diff --cached --quiet; then
            git commit -m "style: fix frontend lint and formatting"
            git push origin HEAD:main
          fi
