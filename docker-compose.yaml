services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - php
    volumes:
      - .:/var/www/html

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: >
      sh -c "
      chown -R www-data:www-data storage bootstrap/cache &&
      php-fpm
      "
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GRADING_LLM_URL=${GRADING_LLM_URL:-https://openrouter.ai/api/v1/chat/completions}
      - GRADING_LLM_MODEL=${GRADING_LLM_MODEL:-google/gemini-3.7-flash}
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: php artisan queue:work --verbose --tries=3 --timeout=300
    restart: unless-stopped
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GRADING_LLM_URL=${GRADING_LLM_URL:-https://openrouter.ai/api/v1/chat/completions}
      - GRADING_LLM_MODEL=${GRADING_LLM_MODEL:-google/gemini-3.7-flash}
    depends_on:
      mysql:
        condition: service_healthy
      php:
        condition: service_started
    volumes:
      - .:/var/www/html

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    restart: unless-stopped
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GRADING_LLM_URL=${GRADING_LLM_URL:-https://openrouter.ai/api/v1/chat/completions}
      - GRADING_LLM_MODEL=${GRADING_LLM_MODEL:-google/gemini-3.7-flash}
    depends_on:
      mysql:
        condition: service_healthy
      php:
        condition: service_started
    volumes:
      - .:/var/www/html

  python:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-3.7-flash}
      - HOME=/tmp
    user: "33:33"
    volumes:
      - ./python:/app
      - ./storage:/storage
    expose:
      - "8000"
    depends_on:
      - redis

  mysql:
    image: mysql:9
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tcc
      MYSQL_USER: tcc
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: